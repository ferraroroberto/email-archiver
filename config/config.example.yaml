# Email Archiver Configuration
# Copy this file to config.yaml and set archive.root_paths to your OneDrive archive root(s).
#
#   copy config\config.example.yaml config\config.yaml
#
# Then edit config/config.yaml and set archive.root_paths.

archive:
  # List of absolute paths to your email archive roots (OneDrive local sync folders)
  root_paths:
    - "C:/Users/YourName/OneDrive/Documentos/"
    - "C:/Users/YourName/OneDrive/Archive/"

naming:
  # Prepend the email's sent date to archived filenames.
  #   false            → 023 - subject.msg
  #   true             → 2026-03-14 - 023 - subject.msg
  #   auto (default)   → infer per destination folder from what it already
  #                       holds (majority of existing numbered files wins;
  #                       falls back to the undated form when the folder is
  #                       empty, has no numbered files, or ties)
  # The NNN sequence is always present and always shared by an email and its
  # attachments. Sequence allocation reads both forms whichever way this is
  # set, so it is safe to flip at any time — a folder holding a mix of dated
  # and undated files still gets the correct next number.
  date_prefix: auto

outlook:
  # Batch mode only (main_batch.py). After `apply` has written a mail to disk
  # it moves the mail out of the Inbox into this folder, looked up by name
  # directly under the mailbox root and created if it does not exist, and
  # stamps it with the category below. `revert` reverses both.
  archive_folder: "Archive"
  category: "Archived by task-os"

database:
  # Path relative to the project root or absolute
  path: "data/emails.db"

scanning:
  batch_size: 500
  body_preview_length: 500

path:
  # Maximum path length (chars) honoured by BOTH the scanner (skips existing
  # paths longer than this) and the archiver (shortens filenames so the path it
  # writes never overflows). Windows MAX_PATH is 260 incl. the terminating NUL;
  # 255 leaves headroom for the OS, COM marshalling, and long-path prefixes.
  max_length: 255

suggestion:
  max_suggestions: 3
  min_score: 0.05

ui:
  window_width: 1100
  window_height: 560
  font_family: "Segoe UI"
  font_size_normal: 10
  font_size_title: 13

logging:
  level: "INFO"
  file: "logs/archiver.log"
