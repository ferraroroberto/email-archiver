runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "1ed07ddb5002d4513adf0ce45f1bfaf68f3acc32", dest = "scripts/comment_ratchet.py" }
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_frontmatter.py" }
instruction_repeats = { src = "scripts/instruction_repeats.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_repeats.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py through
# scripts/static_ratchet_gate.py: a duplicate block (jscpd via npx, Python and JS) or an
# unused import/variable (ruff F401,F841), or a ruff bug (B) or security (S) finding (S113
# strict), that is not in .static-ratchet-baseline.json fails. Needs Node and ruff in the gate's venv; a detector that cannot run exits 3,
# which fails the gate. Procedure + limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py: README.md past its size budget or past its baselined size, or a
# new history marker (issue reference, dated heading, changelog heading) in README.md or
# docs/**/*.md that is not in .docs-ratchet-baseline.json, fails. No generated or dated
# report folder exists under docs/, so nothing is excluded. Exit 3 (a file could not be read)
# fails as NOT CONFIRMED. Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet structure check. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py through
# scripts/structure_ratchet_gate.py: a file past 1,000 lines, a function past 100 lines or a
# directory past 40 modules that is new or above its entry in .structure-ratchet-baseline.json
# fails, and so does a root folder outside `shape` + `extra_roots`. Existing offenders are
# baselined at their real size, never excluded. Exit 3 (could not measure) fails as NOT
# CONFIRMED. The pipeline-cli shape has no src/ -> app/ layer pair. Procedure + limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet check of the weekly prompt
# audit's deterministic rules over the instruction files (CLAUDE.md, AGENTS.md; this repo
# keeps no skills or rules files). The gate (scripts/verify-before-ship.ps1) runs
# scripts/instruction_ratchet.py through scripts/instruction_ratchet_gate.py: a rule count
# above its entry in .instruction-ratchet-baseline.json, or a file past its size cap, fails.
# Existing hits are baselined at their real size, never excluded. Exit 3 (a file could not
# be measured) fails as NOT CONFIRMED. Procedure + limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"
ci_expectations = true
agents_pointer = true
repeated_text_words = 12
claude_md_max_lines = 120

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check of the docs' repo references.
# The gate (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py through
# scripts/doc_refs_ratchet_gate.py: a repo path, `python -m` module or relative link named in
# README.md, CLAUDE.md or docs/**/*.md that does not resolve against the tracked tree, and is
# not in .doc-refs-ratchet-baseline.json or allow_refs, fails. Ports are not checked: this
# repo declares no `port`. Exit 3 (a doc could not be read) fails as NOT CONFIRMED. Procedure
# + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# Names of removed symbols: a doc that names one sends the next reader to code that is gone.
retired = [
  { term = "get_next_sequence_number", why = "wrapper removed; use _scan_folder(...).next_sequence" },
]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check for dead Python. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py through
# scripts/dead_code_ratchet_gate.py: a function, class or method that nothing in the tracked
# tree refers to, and that is not in .dead-code-ratchet-baseline.json, fails. Vendored copies
# are read for references but never reported. Exit 3 (a file could not be parsed) fails as NOT
# CONFIRMED. Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet check of fleet conventions as
# `ast` rules. The gate (scripts/verify-before-ship.ps1) runs scripts/conventions_ratchet.py
# through scripts/conventions_ratchet_gate.py: a rule count above its entry in
# .conventions-ratchet-baseline.json fails. Exit 3 (a file could not be parsed) fails as NOT
# CONFIRMED. Rules: no-window (a Windows app), logging-not-print (the default src/ scope,
# which holds the package; cli/ entry points print by design), no-drive-path (any repo),
# subprocess-timeout (a blocking subprocess call must pass timeout= or carry a reasoned exempt marker).
# secret-compare and git-wrapper are off: the repo has neither helper. Procedure + limits:
# project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "subprocess-timeout", "state-literal", "state-set-repeat", "state-write"]

# A raw connect skips the busy timeout, the row factory and the page-cache pragma.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/email_archiver/runtime_files.py"]
why    = "src/email_archiver/runtime_files.py connect_sqlite is the one raw connect, guarded against code folders; callers open the index through database/models.py get_connection (busy timeout, page cache)"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet check of `#NNN` issue references in
# product-code comments (a comment states the present-tense why; history lives in the issue
# and git log). The gate (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py
# through scripts/comment_ratchet_gate.py: a file whose reference count rises above its entry
# in .comment-ratchet-baseline.json fails. Tests and vendored scripts are out of scope by
# default. Exit 3 (a file could not be scanned) fails as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
docstrings = true
history_phrases = true

# [[state_machines]] -- the per-mail filing state of apply and dismiss, declared once.
# src/email_archiver/filing_state.py owns the FilingState enum and the one derive function;
# the conventions ratchet's state rules stop reporting that module and keep reporting any
# other module that re-derives a mail's mode. Why and the state table: docs/filing-state.md.
[[state_machines]]
name   = "filing-state"
module = "src/email_archiver/filing_state.py"
type   = "FilingState"
derive = "derive_filing_state"
